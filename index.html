<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumen Messenger</title>
    <style>
        :root {
            --bg: #0a0a12;
            --surface: #12121f;
            --surface2: #1a1a2e;
            --text: #e8e8f0;
            --text2: #a0a0b8;
            --accent: #8b5cf6;
            --accent2: #a78bfa;
            --online: #34d399;
            --offline: #4b5563;
            --danger: #ef4444;
            --border: #2a2a3e;
            --radius: 12px;
            --radius-sm: 8px;
            --gradient: linear-gradient(135deg, #7c3aed 0%, #8b5cf6 30%, #a78bfa 60%, #c4b5fd 100%);
            --gradient-dark: linear-gradient(135deg, #5b21b6 0%, #7c3aed 50%, #8b5cf6 100%);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            background-image: radial-gradient(ellipse at 20% 20%, rgba(139,92,246,0.08) 0%, transparent 50%), radial-gradient(ellipse at 80% 80%, rgba(124,58,237,0.06) 0%, transparent 50%);
            color: var(--text); height:100vh; display:flex; align-items:center; justify-content:center; overflow:hidden;
            user-select:none; -webkit-user-select:none;
        }
        #app {
            width:100%; max-width:920px; height:95vh; max-height:720px; background:var(--surface); border-radius:20px;
            box-shadow: 0 8px 32px rgba(139,92,246,0.15), 0 2px 8px rgba(0,0,0,0.4);
            display:flex; flex-direction:column; overflow:hidden; border:1px solid var(--border); position:relative;
        }
        #app::before {
            content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--gradient); z-index:10; border-radius:20px 20px 0 0;
        }
        #auth-screen {
            flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px; gap:14px; position:relative; z-index:5;
        }
        #auth-screen .logo-icon {
            width:64px; height:64px; border-radius:18px; background:var(--gradient); display:flex; align-items:center; justify-content:center;
            font-size:32px; margin:0 auto 10px; box-shadow:0 8px 24px rgba(139,92,246,0.35);
        }
        #auth-screen .logo {
            font-size:42px; font-weight:800; letter-spacing:-1.5px; background:var(--gradient); -webkit-background-clip:text;
            -webkit-text-fill-color:transparent; background-clip:text;
        }
        #auth-screen .subtitle { color:var(--text2); font-size:13px; margin-top:-6px; margin-bottom:10px; text-align:center; line-height:1.5; }
        #auth-screen input {
            width:100%; max-width:340px; padding:13px 16px; background:var(--surface2); border:1.5px solid var(--border);
            border-radius:var(--radius-sm); color:var(--text); font-size:15px; outline:none; transition:0.2s;
        }
        #auth-screen input:focus { border-color:var(--accent); box-shadow:0 0 0 4px rgba(139,92,246,0.12); }
        #auth-screen input::placeholder { color:#6b6b80; }
        .btn {
            width:100%; max-width:340px; padding:13px; border:none; border-radius:var(--radius-sm); font-size:15px; font-weight:600;
            cursor:pointer; transition:0.2s;
        }
        .btn:active { transform:scale(0.97); }
        .btn-primary { background:var(--gradient-dark); color:#fff; box-shadow:0 4px 16px rgba(139,92,246,0.3); }
        .btn-primary:hover { box-shadow:0 6px 24px rgba(139,92,246,0.45); transform:translateY(-1px); }
        .btn-primary:disabled { opacity:0.6; transform:none; box-shadow:none; }
        .auth-error { color:var(--danger); font-size:13px; min-height:18px; text-align:center; }
        .auth-tabs { display:flex; max-width:340px; width:100%; border-radius:var(--radius-sm); overflow:hidden; border:1px solid var(--border); }
        .auth-tab {
            flex:1; padding:10px; text-align:center; font-size:14px; font-weight:600; cursor:pointer; transition:0.2s;
            background:var(--surface2); color:var(--text2); border:none;
        }
        .auth-tab.active { background:var(--accent); color:#fff; }
        #reg-fields { display:none; width:100%; max-width:340px; }
        #reg-fields.show { display:flex; flex-direction:column; gap:10px; }
        #main-screen { display:none; flex:1; flex-direction:row; height:100%; overflow:hidden; }
        #main-screen.active { display:flex; }
        #sidebar { width:310px; min-width:310px; background:var(--surface2); display:flex; flex-direction:column; border-right:1px solid var(--border); }
        #sidebar-header { padding:16px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); background:rgba(139,92,246,0.04); }
        #sidebar-header .user-info { display:flex; align-items:center; gap:10px; }
        #sidebar-header .avatar {
            width:38px; height:38px; border-radius:50%; background:var(--gradient); display:flex; align-items:center; justify-content:center;
            font-weight:700; font-size:15px; color:#fff; box-shadow:0 2px 8px rgba(139,92,246,0.3);
        }
        #sidebar-header .username { font-weight:600; font-size:14px; }
        #sidebar-header .logout-btn {
            background:none; border:1px solid var(--border); color:var(--text2); padding:6px 14px; border-radius:20px; cursor:pointer;
            font-size:12px; transition:0.2s; font-weight:500;
        }
        #sidebar-header .logout-btn:hover { border-color:var(--danger); color:var(--danger); background:rgba(239,68,68,0.06); }
        .sidebar-section-title { padding:14px 16px 8px; font-size:10px; text-transform:uppercase; letter-spacing:1.5px; color:var(--accent2); font-weight:700; }
        #contacts-list { flex:1; overflow-y:auto; padding:0 8px; }
        #contacts-list::-webkit-scrollbar { width:3px; }
        #contacts-list::-webkit-scrollbar-thumb { background:#3a3a50; border-radius:3px; }
        .contact-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--radius-sm); cursor:pointer; transition:0.2s; margin-bottom:2px; }
        .contact-item:hover { background:rgba(139,92,246,0.08); }
        .contact-item.active { background:rgba(139,92,246,0.18); box-shadow:inset 3px 0 0 var(--accent); }
        .contact-item .contact-avatar {
            width:42px; height:42px; border-radius:50%; background:#2a2a40; display:flex; align-items:center; justify-content:center;
            font-weight:700; font-size:17px; position:relative; flex-shrink:0; color:var(--accent2);
        }
        .contact-item.active .contact-avatar { background:var(--gradient); color:#fff; }
        .contact-item .status-dot { width:11px; height:11px; border-radius:50%; position:absolute; bottom:0; right:0; border:2.5px solid var(--surface2); }
        .status-dot.online { background:var(--online); box-shadow:0 0 8px rgba(52,211,153,0.5); }
        .status-dot.offline { background:var(--offline); }
        .contact-item .contact-info { flex:1; min-width:0; }
        .contact-item .contact-name { font-weight:500; font-size:14px; }
        .contact-item .contact-status { font-size:11px; color:var(--text2); margin-top:1px; }
        #add-contact-area { padding:12px 16px; border-top:1px solid var(--border); display:flex; gap:8px; background:rgba(0,0,0,0.1); }
        #add-contact-area input {
            flex:1; padding:9px 12px; background:var(--surface); border:1.5px solid var(--border); border-radius:20px; color:var(--text);
            font-size:13px; outline:none; min-width:0; transition:0.2s;
        }
        #add-contact-area input:focus { border-color:var(--accent); }
        #add-contact-area button {
            padding:9px 16px; background:var(--gradient-dark); color:#fff; border:none; border-radius:20px; cursor:pointer; font-size:13px;
            font-weight:600; white-space:nowrap; transition:0.2s;
        }
        #chat-area { flex:1; display:flex; flex-direction:column; min-width:0; background:var(--surface); }
        #chat-header { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; background:rgba(139,92,246,0.03); }
        #chat-header .chat-partner-wrap { flex:1; min-width:0; }
        #chat-header .chat-partner { font-weight:600; font-size:15px; }
        #chat-header .chat-partner-status { font-size:12px; margin-top:1px; }
        .call-btn {
            padding:8px 18px; background:var(--gradient); color:#fff; border:none; border-radius:20px; cursor:pointer; font-weight:600;
            font-size:13px; transition:0.2s; box-shadow:0 2px 8px rgba(139,92,246,0.25); white-space:nowrap;
        }
        .call-btn.in-call { background:var(--danger); }
        #messages-container {
            flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:4px;
            background:radial-gradient(ellipse at 50% 50%, rgba(139,92,246,0.02) 0%, transparent 70%);
        }
        #messages-container::-webkit-scrollbar { width:4px; }
        #messages-container::-webkit-scrollbar-thumb { background:#3a3a50; border-radius:4px; }
        .message { max-width:72%; padding:10px 15px; border-radius:18px; font-size:14px; line-height:1.45; word-break:break-word; animation:msgIn 0.25s ease; }
        @keyframes msgIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
        .message.sent { align-self:flex-end; background:var(--gradient-dark); color:#fff; border-bottom-right-radius:6px; box-shadow:0 2px 8px rgba(139,92,246,0.2); }
        .message.received { align-self:flex-start; background:var(--surface2); border-bottom-left-radius:6px; border:1px solid var(--border); }
        .message .msg-time { font-size:10px; opacity:0.65; margin-top:4px; text-align:right; }
        #input-area { padding:12px 20px; border-top:1px solid var(--border); display:flex; gap:10px; background:rgba(0,0,0,0.1); }
        #input-area input {
            flex:1; padding:11px 18px; background:var(--surface2); border:1.5px solid var(--border); border-radius:24px; color:var(--text);
            font-size:14px; outline:none; transition:0.2s;
        }
        #input-area input:focus { border-color:var(--accent); }
        #input-area button {
            width:44px; height:44px; border-radius:50%; background:var(--gradient); color:#fff; border:none; cursor:pointer; font-size:18px;
            transition:0.2s; flex-shrink:0; box-shadow:0 2px 8px rgba(139,92,246,0.3);
        }
        .no-chat { flex:1; display:flex; align-items:center; justify-content:center; color:var(--text2); font-size:14px; flex-direction:column; gap:10px; }
        #call-overlay {
            display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(10,10,18,0.92);
            backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); z-index:100; flex-direction:column; align-items:center; justify-content:center; gap:24px;
        }
        #call-overlay.active { display:flex; }
        #call-overlay .call-avatar {
            width:80px; height:80px; border-radius:50%; background:var(--gradient); display:flex; align-items:center; justify-content:center;
            font-size:36px; font-weight:700; color:#fff; box-shadow:0 8px 32px rgba(139,92,246,0.4); animation:pulse 2s infinite;
        }
        @keyframes pulse { 0%,100%{ box-shadow:0 8px 32px rgba(139,92,246,0.4); } 50%{ box-shadow:0 8px 48px rgba(139,92,246,0.7); } }
        #call-overlay .call-info { font-size:20px; font-weight:600; }
        #call-overlay .call-status { font-size:13px; color:var(--accent2); min-height:20px; }
        #call-overlay .call-controls { display:flex; gap:20px; align-items:center; margin-top:8px; }
        #call-overlay .call-controls button { width:60px; height:60px; border-radius:50%; border:none; cursor:pointer; font-size:24px; transition:0.2s; }
        .btn-hangup { background:var(--danger); color:#fff; box-shadow:0 4px 16px rgba(239,68,68,0.4); }
        .btn-mute { background:var(--surface2); color:var(--text); border:2px solid var(--border)!important; }
        .btn-mute.muted { background:var(--danger); border-color:var(--danger)!important; color:#fff; }
        #volume-control-area { display:flex; align-items:center; gap:12px; background:var(--surface2); padding:12px 22px; border-radius:28px; border:1px solid var(--border); }
        #volume-slider { -webkit-appearance:none; width:150px; height:6px; border-radius:3px; background:#3a3a50; outline:none; cursor:pointer; }
        #volume-slider::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:var(--gradient); cursor:pointer; }
        #volume-label { font-size:13px; font-weight:600; width:42px; text-align:center; color:var(--accent2); }
        #toast {
            position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#1f1f36; color:#fff; padding:11px 24px;
            border-radius:24px; font-size:13px; z-index:200; opacity:0; transition:opacity 0.3s; pointer-events:none; border:1px solid var(--border);
        }
        #toast.show { opacity:1; }
        .back-btn { display:none; background:none; border:none; color:var(--accent2); font-size:22px; cursor:pointer; padding:4px 8px; }
        @media (max-width:650px) {
            #app { height:100vh; max-height:100vh; border-radius:0; max-width:100%; }
            #sidebar { width:100%; min-width:100%; }
            #main-screen.chat-open #sidebar { display:none; }
            #main-screen.chat-open #chat-area { display:flex; }
            #chat-area { display:none; }
            #chat-area.active-mobile { display:flex; }
            .back-btn { display:inline-flex!important; }
            #volume-slider { width:100px; }
        }
    </style>
</head>

<script>
// ==================== КОНФИГУРАЦИЯ ====================
var SUPABASE_URL = 'https://wiuhicakznpyfaxxvnjj.supabase.co';
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndpdWhpY2Frem5weWZheHh2bmpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0Nzg2MjksImV4cCI6MjEwMTA1NDYyOX0.u5fa1Lp7MaqfVMQFxEZ0vdsqRvzyEgRg2RjUJugrbFk';

// ==================== API КЛИЕНТ ====================
var _accessToken = null;

function authHeaders() {
    // Для auth-эндпоинтов ВСЕГДА используем SUPABASE_KEY
    return {
        'apikey': SUPABASE_KEY,
        'Content-Type': 'application/json'
    };
}

function restHeaders() {
    // Для REST API используем access_token если есть, иначе SUPABASE_KEY
    var token = _accessToken || SUPABASE_KEY;
    return {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation'
    };
}

// ==================== AUTH ====================
async function supabaseSignUp(email, password, nickname) {
    var res = await fetch(SUPABASE_URL + '/auth/v1/signup', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ email: email, password: password, data: { nickname: nickname } })
    });
    var data = await res.json();
    if (!res.ok) throw new Error(data.msg || JSON.stringify(data));
    if (data.access_token) {
        _accessToken = data.access_token;
        localStorage.setItem('lumen_token', data.access_token);
    }
    return data;
}

async function supabaseSignIn(email, password) {
    var res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ email: email, password: password })
    });
    var data = await res.json();
    if (!res.ok) throw new Error(data.msg || data.error_description || JSON.stringify(data));
    if (data.access_token) {
        _accessToken = data.access_token;
        localStorage.setItem('lumen_token', data.access_token);
    }
    return data;
}

async function supabaseSignOut() {
    if (_accessToken) {
        await fetch(SUPABASE_URL + '/auth/v1/logout', {
            method: 'POST',
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + _accessToken }
        });
    }
    _accessToken = null;
    localStorage.removeItem('lumen_token');
}

async function supabaseGetUser() {
    if (!_accessToken) return null;
    var res = await fetch(SUPABASE_URL + '/auth/v1/user', {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + _accessToken }
    });
    if (!res.ok) { _accessToken = null; localStorage.removeItem('lumen_token'); return null; }
    return await res.json();
}

// ==================== REST API ====================
async function apiGet(table, query) {
    var url = SUPABASE_URL + '/rest/v1/' + table;
    if (query) {
        var params = new URLSearchParams();
        for (var k in query) params.append(k, query[k]);
        url += '?' + params.toString();
    }
    var res = await fetch(url, { headers: restHeaders() });
    if (!res.ok) { console.error('GET error', table, await res.text()); return { data: null, error: true }; }
    return { data: await res.json(), error: null };
}

async function apiPost(table, body) {
    var res = await fetch(SUPABASE_URL + '/rest/v1/' + table, {
        method: 'POST',
        headers: restHeaders(),
        body: JSON.stringify(body)
    });
    if (!res.ok) { console.error('POST error', table, await res.text()); return { error: true }; }
    return { error: null };
}

var currentUser = null;

var peer = null;
var currentCall = null;
var localStream = null;
var remoteAudio = null;
var isMuted = false;
var contactsStatuses = {};
var peerIdToContactId = {};
var presenceIntervalId = null;

// ==================== TOAST ====================
function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { toast.classList.remove('show'); }, 2800);
}
function escapeHtml(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function getInitials(n) { return (n || '?')[0].toUpperCase(); }
function formatTime(i) { return new Date(i).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }

// ==================== ПРОФИЛИ ====================
async function upsertProfile(uid, nick, email) {
    var body = { id: uid, nickname: nick, updated_at: new Date().toISOString() };
    if (email) body.email = email;
    // Пробуем PATCH (если запись есть)
    var res = await fetch(SUPABASE_URL + '/rest/v1/lumen_profiles?id=eq.' + uid, {
        method: 'PATCH',
        headers: restHeaders(),
        body: JSON.stringify(body)
    });
    // Если не получилось — вставляем
    if (!res.ok) {
        await apiPost('lumen_profiles', body);
    }
}
async function findProfileByNickname(nick) {
    var result = await apiGet('lumen_profiles', { nickname: 'ilike.' + nick.trim(), limit: '1' });
    return (result.data && result.data.length > 0) ? result.data[0] : null;
}

// ==================== КОНТАКТЫ ====================
async function loadContacts() {
    if (!currentUser) return;
    var result = await apiGet('lumen_contacts', { user_id: 'eq.' + currentUser.id });
    // Загружаем контакты, а ники берём отдельным запросом
    var rawContacts = result.data || [];
    contacts = [];
    for (var i = 0; i < rawContacts.length; i++) {
        var c = rawContacts[i];
        var profileRes = await apiGet('lumen_profiles', { id: 'eq.' + c.contact_id, limit: '1' });
        var nickname = (profileRes.data && profileRes.data.length > 0) ? profileRes.data[0].nickname : 'Неизвестный';
        contacts.push({ contact_id: c.contact_id, nickname: nickname });
    }
    renderContacts();
}
async function addContact(cid) {
    if (cid === currentUser.id) { showToast('Нельзя добавить себя'); return; }
    if (contacts.find(function(c) { return c.contact_id === cid; })) { showToast('Уже в контактах'); return; }
    await apiPost('lumen_contacts', { user_id: currentUser.id, contact_id: cid });
    await loadContacts();
    showToast('✅ Добавлен');
}
function renderContacts() {
    contactsList.innerHTML = '';
    if (!contacts.length) {
        contactsList.innerHTML = '<div style="padding:30px;text-align:center;color:var(--text2);font-size:13px;">Список пуст</div>';
        return;
    }
    contacts.forEach(function(c) {
        var status = contactsStatuses[c.contact_id] || 'offline';
        var d = document.createElement('div');
        d.className = 'contact-item' + (c.contact_id === currentContactId ? ' active' : '');
        d.innerHTML = '<div class="contact-avatar">' + getInitials(c.nickname) + '<div class="status-dot ' + status + '"></div></div><div class="contact-info"><div class="contact-name">' + escapeHtml(c.nickname) + '</div><div class="contact-status">' + (status === 'online' ? '🟢 В сети' : '⚫ Не в сети') + '</div></div>';
        d.addEventListener('click', function() { openChat(c.contact_id, c.nickname); });
        contactsList.appendChild(d);
    });
}

// ==================== СООБЩЕНИЯ ====================
async function loadMessages() {
    if (!currentContactId || !currentUser) return;
    var result = await apiGet('lumen_messages', {
        or: '(sender_id.eq.' + currentUser.id + ',receiver_id.eq.' + currentUser.id + ')',
        order: 'created_at.asc',
        limit: '500'
    });
    messagesCache[currentContactId] = (result.data || []).filter(function(m) {
        return (m.sender_id === currentUser.id && m.receiver_id === currentContactId) ||
               (m.sender_id === currentContactId && m.receiver_id === currentUser.id);
    });
    renderMessages();
}
function renderMessages() {
    messagesContainer.innerHTML = '';
    var msgs = messagesCache[currentContactId] || [];
    if (!msgs.length) {
        messagesContainer.innerHTML = '<div style="text-align:center;color:var(--text2);padding:50px;font-size:13px;">💬 Нет сообщений</div>';
        return;
    }
    msgs.forEach(function(m) {
        var d = document.createElement('div');
        d.className = 'message ' + (m.sender_id === currentUser.id ? 'sent' : 'received');
        d.innerHTML = escapeHtml(m.text) + '<div class="msg-time">' + formatTime(m.created_at) + '</div>';
        messagesContainer.appendChild(d);
    });
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
}
async function sendMessage(text) {
    if (!text.trim() || !currentContactId || !currentUser) return;
    var msg = { sender_id: currentUser.id, receiver_id: currentContactId, text: text.trim(), created_at: new Date().toISOString() };
    await apiPost('lumen_messages', msg);
    if (!messagesCache[currentContactId]) messagesCache[currentContactId] = [];
    messagesCache[currentContactId].push(msg);
    renderMessages();
}

// ==================== PRESENCE ====================
function startPresencePolling() {
    if (presenceIntervalId) clearInterval(presenceIntervalId);
    presenceIntervalId = setInterval(function() { if (currentUser) renderContacts(); }, 10000);
}

// ==================== PEERJS (ЗВОНКИ) ====================
function setupPeer() {
    if (typeof Peer === 'undefined') { console.log('PeerJS не загружен'); return; }
    if (!currentUser) return;
    if (peer) { try { peer.destroy(); } catch(e) {} }
    peer = new Peer(currentUser.id, { host: '0.peerjs.com', port: 443, secure: true, debug: 0 });
    peer.on('open', function() {});
    peer.on('call', async function(call) {
        if (currentCall) { call.close(); return; }
        try { localStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
        catch(e) { showToast('Нет микрофона'); call.close(); return; }
        call.answer(localStream);
        setupCallUI(call);
    });
    peer.on('error', function() {});
    peer.on('disconnected', function() { peer.reconnect(); });
}
async function startCall() {
    if (!currentContactId || !peer || currentCall) return;
    if (typeof Peer === 'undefined') { showToast('Звонки недоступны'); return; }
    try { localStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch(e) { showToast('Нет микрофона'); return; }
    var call = peer.call(peerIdToContactId[currentContactId] || currentContactId, localStream);
    if (!call) { if (localStream) { localStream.getTracks().forEach(function(t) { t.stop(); }); localStream = null; } showToast('Абонент недоступен'); return; }
    setupCallUI(call);
}
function setupCallUI(call) {
    currentCall = call; callOverlay.classList.add('active');
    callAvatarDisplay.textContent = getInitials(currentContactUsername || '?');
    callPartnerDisplay.textContent = '📞 ' + (currentContactUsername || 'Собеседник');
    callStatus.textContent = 'Соединение...'; callStatus.style.color = 'var(--accent2)';
    volumeSlider.value = 50; volumeLabel.textContent = '50%'; isMuted = false;
    btnToggleMic.classList.remove('muted'); btnToggleMic.textContent = '🎤';
    if (localStream) localStream.getAudioTracks().forEach(function(t) { t.enabled = true; });
    btnCall.classList.add('in-call'); btnCall.textContent = '📞 В звонке';
    call.on('stream', function(rs) {
        callStatus.textContent = '🟢 Разговор'; callStatus.style.color = 'var(--online)';
        if (remoteAudio) { remoteAudio.srcObject = null; remoteAudio.remove(); }
        remoteAudio = document.createElement('audio'); remoteAudio.srcObject = rs; remoteAudio.autoplay = true; remoteAudio.playsInline = true;
        document.body.appendChild(remoteAudio); applyVolume();
    });
    call.on('close', function() { endCallUI(); showToast('Звонок завершён'); });
    call.on('error', function() { callStatus.textContent = 'Ошибка'; setTimeout(endCallUI, 2000); });
}
function applyVolume() {
    if (!remoteAudio) return; var v = parseInt(volumeSlider.value); var g;
    var pts = [[0,0],[1,0.002],[25,0.1],[50,0.2],[75,0.5],[100,1.0]];
    if (v <= 0) g = 0; else if (v >= 100) g = 1;
    else for (var i = 0; i < pts.length-1; i++) if (v >= pts[i][0] && v <= pts[i+1][0]) { g = pts[i][1] + (v - pts[i][0]) / (pts[i+1][0] - pts[i][0]) * (pts[i+1][1] - pts[i][1]); break; }
    remoteAudio.volume = Math.max(0, Math.min(1, g));
}
function toggleMute() { isMuted = !isMuted; if (localStream) localStream.getAudioTracks().forEach(function(t) { t.enabled = !isMuted; }); btnToggleMic.classList.toggle('muted', isMuted); btnToggleMic.textContent = isMuted ? '🔇' : '🎤'; }
function endCall() { if (currentCall) try { currentCall.close(); } catch(e) {} endCallUI(); }
function endCallUI() {
    callOverlay.classList.remove('active');
    if (remoteAudio) { remoteAudio.srcObject = null; remoteAudio.remove(); remoteAudio = null; }
    if (localStream) { localStream.getTracks().forEach(function(t) { t.stop(); }); localStream = null; }
    currentCall = null; isMuted = false; btnToggleMic.classList.remove('muted'); btnToggleMic.textContent = '🎤';
    btnCall.classList.remove('in-call'); btnCall.textContent = '📞 Звонок';
}

// ==================== ЧАТ ====================
async function openChat(cid, cnick) {
    currentContactId = cid; currentContactUsername = cnick;
    chatPartnerName.textContent = cnick; updateChatPartnerStatus();
    chatHeader.style.display = 'flex'; inputArea.style.display = 'flex'; noChatPlaceholder.style.display = 'none';
    mainScreen.classList.add('chat-open'); document.getElementById('chat-area').classList.add('active-mobile');
    btnCall.classList.toggle('in-call', !!currentCall); btnCall.textContent = currentCall ? '📞 В звонке' : '📞 Звонок';
    renderContacts(); await loadMessages(); messageInput.focus();
}
function updateChatPartnerStatus() {
    if (!currentContactId) return;
    var s = contactsStatuses[currentContactId] || 'offline';
    chatPartnerStatus.textContent = s === 'online' ? '🟢 В сети' : '⚫ Не в сети';
    chatPartnerStatus.style.color = s === 'online' ? 'var(--online)' : 'var(--text2)';
}

// ==================== АВТОРИЗАЦИЯ ====================
async function login(identity, password) {
    var isEmail = identity.indexOf('@') !== -1;
    var email = identity.trim();
    if (!isEmail) {
        var profile = await findProfileByNickname(identity.trim());
        if (!profile || !profile.email) throw new Error('Пользователь не найден. Войдите по email.');
        email = profile.email;
    }
    var data = await supabaseSignIn(email, password);
    if (data.user) {
        await upsertProfile(data.user.id, data.user.user_metadata.nickname || email.split('@')[0], email);
    }
    return data;
}
async function register(email, password, nickname) {
    var data = await supabaseSignUp(email, password, nickname);
    if (data.user) {
    await upsertProfile(data.user.id, data.user.user_metadata.nickname || email.split('@')[0], email);
    await onUserReady(data.user);
    }
}

// ==================== ГЛАВНЫЙ ПОТОК ====================
async function onUserReady(user) {
    currentUser = user;
    if (!user) {
        authScreen.style.display = 'flex'; mainScreen.classList.remove('active');
        if (presenceIntervalId) { clearInterval(presenceIntervalId); presenceIntervalId = null; }
        if (peer) { peer.destroy(); peer = null; }
        endCallUI(); contacts = []; currentContactId = null; currentContactUsername = null; messagesCache = {};
        contactsList.innerHTML = ''; chatHeader.style.display = 'none'; inputArea.style.display = 'none';
        noChatPlaceholder.style.display = 'flex'; messagesContainer.innerHTML = '';
        document.getElementById('chat-area').classList.remove('active-mobile'); mainScreen.classList.remove('chat-open');
        return;
    }
    var nick = 'User';
    if (user.user_metadata && user.user_metadata.nickname) nick = user.user_metadata.nickname;
    else if (user.email) nick = user.email.split('@')[0];
    console.log('USER:', user.id, nick);
    authScreen.style.display = 'none'; mainScreen.classList.add('active');
    myAvatar.textContent = getInitials(nick); myUsername.textContent = nick;
    await loadContacts(); setupPeer(); startPresencePolling();
}

// ==================== ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК ====================
function setAuthMode(mode) {
    authMode = mode;
    if (mode === 'login') {
        tabLogin.classList.add('active'); tabRegister.classList.remove('active');
        loginFields.style.display = 'block'; regFields.classList.remove('show');
        btnSubmit.textContent = '🚀 Войти';
    } else {
        tabRegister.classList.add('active'); tabLogin.classList.remove('active');
        loginFields.style.display = 'none'; regFields.classList.add('show');
        btnSubmit.textContent = '✨ Создать аккаунт';
    }
    authError.textContent = '';
}
tabLogin.addEventListener('click', function() { setAuthMode('login'); });
tabRegister.addEventListener('click', function() { setAuthMode('register'); });

// ==================== ОБРАБОТЧИКИ ====================
btnSubmit.addEventListener('click', async function() {
    authError.textContent = ''; btnSubmit.disabled = true;
    if (authMode === 'register') {
        var email = regEmail.value.trim(); var nick = regNickname.value.trim(); var pass = regPassword.value;
        if (!email || !nick || pass.length < 6) { authError.textContent = 'Заполните все поля. Пароль минимум 6 символов.'; btnSubmit.disabled = false; return; }
        btnSubmit.textContent = 'Создаём...';
        try {
            await register(email, pass, nick);
            showToast('✅ Аккаунт создан! Теперь войдите.');
            setAuthMode('login'); loginIdentity.value = nick;
            regEmail.value = ''; regNickname.value = ''; regPassword.value = '';
        } catch(e) {
            var msg = e.message || '';
            authError.textContent = (msg.indexOf('already') !== -1) ? 'Этот email уже зарегистрирован' : msg;
        }
        btnSubmit.textContent = '✨ Создать аккаунт'; btnSubmit.disabled = false;
        return;
    }
    var identity = loginIdentity.value.trim(); var pass = loginPassword.value;
    if (!identity || pass.length < 6) { authError.textContent = 'Введите никнейм/email и пароль.'; btnSubmit.disabled = false; return; }
    btnSubmit.textContent = 'Входим...';
    try {
        await login(identity, pass);
        showToast('👋 Добро пожаловать!');
        loginIdentity.value = ''; loginPassword.value = '';
    } catch(e) {
        var msg = e.message || '';
        authError.textContent = (msg.indexOf('Invalid') !== -1) ? 'Неверный никнейм/email или пароль' : msg;
    }
    btnSubmit.textContent = '🚀 Войти'; btnSubmit.disabled = false;
});

[loginIdentity, loginPassword, regEmail, regNickname, regPassword].forEach(function(el) {
    el.addEventListener('keydown', function(e) { if (e.key === 'Enter') btnSubmit.click(); });
});
btnLogout.addEventListener('click', async function() { await supabaseSignOut(); onUserReady(null); });
btnAddContact.addEventListener('click', async function() {
    var n = addContactInput.value.trim(); if (!n) { showToast('Введите никнейм'); return; }
    var p = await findProfileByNickname(n); if (!p) { showToast('Пользователь не найден'); return; }
    await addContact(p.id); addContactInput.value = '';
});
addContactInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') btnAddContact.click(); });
btnSend.addEventListener('click', async function() { var t = messageInput.value; if (!t.trim()) return; messageInput.value = ''; await sendMessage(t); messageInput.focus(); });
messageInput.addEventListener('keydown', function(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); btnSend.click(); } });
btnCall.addEventListener('click', function() { if (currentCall) endCall(); else startCall(); });
btnHangup.addEventListener('click', endCall);
btnToggleMic.addEventListener('click', toggleMute);
volumeSlider.addEventListener('input', function() { volumeLabel.textContent = volumeSlider.value + '%'; applyVolume(); });
btnBack.addEventListener('click', function() {
    currentContactId = null; currentContactUsername = null;
    chatHeader.style.display = 'none'; inputArea.style.display = 'none'; noChatPlaceholder.style.display = 'flex';
    messagesContainer.innerHTML = ''; document.getElementById('chat-area').classList.remove('active-mobile'); mainScreen.classList.remove('chat-open');
    renderContacts();
});
document.addEventListener('keydown', function(e) { if (e.key === 'Escape' && currentCall) endCall(); });

// ==================== PEERJS ====================
(function() {
    var s = document.createElement('script');
    // Пробуем другой CDN
    s.src = 'https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js';
    s.onload = function() { console.log('PeerJS loaded'); setupPeer(); };
    s.onerror = function() {
        // Второй вариант
        var s2 = document.createElement('script');
        s2.src = 'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js';
        s2.onload = function() { console.log('PeerJS loaded (fallback)'); setupPeer(); };
        s2.onerror = function() { console.log('PeerJS unavailable'); };
        document.head.appendChild(s2);
    };
    document.head.appendChild(s);
})();

// ==================== ИНИЦИАЛИЗАЦИЯ ====================
setAuthMode('login');
(async function init() {
    var saved = localStorage.getItem('lumen_token');
    if (saved) { _accessToken = saved; var user = await supabaseGetUser(); if (user) { await onUserReady(user); return; } _accessToken = null; localStorage.removeItem('lumen_token'); }
    onUserReady(null);
    console.log('💜 Lumen готов');
})();
</script>
