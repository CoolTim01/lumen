<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumen Messenger</title>
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
    <style>
        :root {
            --bg: #0a0a12;
            --surface: #12121f;
            --surface2: #1a1a2e;
            --text: #e8e8f0;
            --text2: #a0a0b8;
            --accent: #8b5cf6;
            --accent2: #a78bfa;
            --accent-glow: #c4b5fd;
            --online: #34d399;
            --offline: #4b5563;
            --danger: #ef4444;
            --border: #2a2a3e;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 8px 32px rgba(139, 92, 246, 0.15), 0 2px 8px rgba(0, 0, 0, 0.4);
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --gradient: linear-gradient(135deg, #7c3aed 0%, #8b5cf6 30%, #a78bfa 60%, #c4b5fd 100%);
            --gradient-dark: linear-gradient(135deg, #5b21b6 0%, #7c3aed 50%, #8b5cf6 100%);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            background-image: radial-gradient(ellipse at 20% 20%, rgba(139,92,246,0.08) 0%, transparent 50%), radial-gradient(ellipse at 80% 80%, rgba(124,58,237,0.06) 0%, transparent 50%);
            color: var(--text); height:100vh; display:flex; align-items:center; justify-content:center; overflow:hidden;
            user-select:none; -webkit-user-select:none;
        }
        #app {
            width:100%; max-width:920px; height:95vh; max-height:720px; background:var(--surface); border-radius:20px;
            box-shadow:var(--shadow); display:flex; flex-direction:column; overflow:hidden; border:1px solid var(--border); position:relative;
        }
        #app::before {
            content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--gradient); z-index:10; border-radius:20px 20px 0 0;
        }
        /* === AUTH SCREEN === */
        #auth-screen {
            flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px; gap:14px; position:relative; z-index:5;
        }
        #auth-screen .logo-icon {
            width:64px; height:64px; border-radius:18px; background:var(--gradient); display:flex; align-items:center; justify-content:center;
            font-size:32px; margin:0 auto 10px; box-shadow:0 8px 24px rgba(139,92,246,0.35);
        }
        #auth-screen .logo {
            font-size:42px; font-weight:800; letter-spacing:-1.5px; background:var(--gradient); -webkit-background-clip:text;
            -webkit-text-fill-color:transparent; background-clip:text;
        }
        #auth-screen .subtitle { color:var(--text2); font-size:13px; margin-top:-6px; margin-bottom:10px; text-align:center; line-height:1.5; }
        #auth-screen input {
            width:100%; max-width:340px; padding:13px 16px; background:var(--surface2); border:1.5px solid var(--border);
            border-radius:var(--radius-sm); color:var(--text); font-size:15px; outline:none; transition:var(--transition);
        }
        #auth-screen input:focus { border-color:var(--accent); box-shadow:0 0 0 4px rgba(139,92,246,0.12); }
        #auth-screen input::placeholder { color:#6b6b80; }
        .btn {
            width:100%; max-width:340px; padding:13px; border:none; border-radius:var(--radius-sm); font-size:15px; font-weight:600;
            cursor:pointer; transition:var(--transition); position:relative; overflow:hidden;
        }
        .btn:active { transform:scale(0.97); }
        .btn-primary { background:var(--gradient-dark); color:#fff; box-shadow:0 4px 16px rgba(139,92,246,0.3); }
        .btn-primary:hover { box-shadow:0 6px 24px rgba(139,92,246,0.45); transform:translateY(-1px); }
        .btn-secondary { background:var(--surface2); color:var(--text); border:1.5px solid var(--border); }
        .btn-secondary:hover { border-color:var(--accent); background:#1f1f36; }
        .divider { color:var(--text2); font-size:12px; display:flex; align-items:center; gap:12px; max-width:340px; width:100%; }
        .divider::before,.divider::after { content:''; flex:1; height:1px; background:var(--border); }
        .auth-error { color:var(--danger); font-size:13px; min-height:18px; text-align:center; }
        .auth-hint { font-size:11px; color:var(--text2); text-align:center; margin-top:2px; }
        .auth-tabs { display:flex; gap:0; max-width:340px; width:100%; border-radius:var(--radius-sm); overflow:hidden; border:1px solid var(--border); }
        .auth-tab {
            flex:1; padding:10px; text-align:center; font-size:14px; font-weight:600; cursor:pointer; transition:var(--transition);
            background:var(--surface2); color:var(--text2); border:none;
        }
        .auth-tab.active { background:var(--accent); color:#fff; }
        #reg-fields { display:none; width:100%; max-width:340px; }
        #reg-fields.show { display:flex; flex-direction:column; gap:10px; }
        /* === MAIN SCREEN === */
        #main-screen { display:none; flex:1; flex-direction:row; height:100%; overflow:hidden; }
        #main-screen.active { display:flex; }
        #sidebar { width:310px; min-width:310px; background:var(--surface2); display:flex; flex-direction:column; border-right:1px solid var(--border); position:relative; z-index:5; }
        #sidebar-header { padding:16px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); background:rgba(139,92,246,0.04); }
        #sidebar-header .user-info { display:flex; align-items:center; gap:10px; }
        #sidebar-header .avatar {
            width:38px; height:38px; border-radius:50%; background:var(--gradient); display:flex; align-items:center; justify-content:center;
            font-weight:700; font-size:15px; color:#fff; box-shadow:0 2px 8px rgba(139,92,246,0.3);
        }
        #sidebar-header .username { font-weight:600; font-size:14px; }
        #sidebar-header .logout-btn {
            background:none; border:1px solid var(--border); color:var(--text2); padding:6px 14px; border-radius:20px; cursor:pointer;
            font-size:12px; transition:var(--transition); font-weight:500;
        }
        #sidebar-header .logout-btn:hover { border-color:var(--danger); color:var(--danger); background:rgba(239,68,68,0.06); }
        .sidebar-section-title { padding:14px 16px 8px; font-size:10px; text-transform:uppercase; letter-spacing:1.5px; color:var(--accent2); font-weight:700; }
        #contacts-list { flex:1; overflow-y:auto; padding:0 8px; }
        #contacts-list::-webkit-scrollbar { width:3px; }
        #contacts-list::-webkit-scrollbar-thumb { background:#3a3a50; border-radius:3px; }
        .contact-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--radius-sm); cursor:pointer; transition:var(--transition); margin-bottom:2px; }
        .contact-item:hover { background:rgba(139,92,246,0.08); }
        .contact-item.active { background:rgba(139,92,246,0.18); box-shadow:inset 3px 0 0 var(--accent); }
        .contact-item .contact-avatar {
            width:42px; height:42px; border-radius:50%; background:#2a2a40; display:flex; align-items:center; justify-content:center;
            font-weight:700; font-size:17px; position:relative; flex-shrink:0; color:var(--accent2);
        }
        .contact-item.active .contact-avatar { background:var(--gradient); color:#fff; }
        .contact-item .status-dot { width:11px; height:11px; border-radius:50%; position:absolute; bottom:0; right:0; border:2.5px solid var(--surface2); }
        .status-dot.online { background:var(--online); box-shadow:0 0 8px rgba(52,211,153,0.5); }
        .status-dot.offline { background:var(--offline); }
        .contact-item .contact-info { flex:1; min-width:0; }
        .contact-item .contact-name { font-weight:500; font-size:14px; }
        .contact-item .contact-status { font-size:11px; color:var(--text2); margin-top:1px; }
        #add-contact-area { padding:12px 16px; border-top:1px solid var(--border); display:flex; gap:8px; background:rgba(0,0,0,0.1); }
        #add-contact-area input {
            flex:1; padding:9px 12px; background:var(--surface); border:1.5px solid var(--border); border-radius:20px; color:var(--text);
            font-size:13px; outline:none; min-width:0; transition:var(--transition);
        }
        #add-contact-area input:focus { border-color:var(--accent); }
        #add-contact-area button {
            padding:9px 16px; background:var(--gradient-dark); color:#fff; border:none; border-radius:20px; cursor:pointer; font-size:13px;
            font-weight:600; white-space:nowrap; transition:var(--transition);
        }
        #add-contact-area button:hover { box-shadow:0 4px 12px rgba(139,92,246,0.35); }
        #chat-area { flex:1; display:flex; flex-direction:column; min-width:0; background:var(--surface); }
        #chat-header { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; background:rgba(139,92,246,0.03); }
        #chat-header .chat-partner-wrap { flex:1; min-width:0; }
        #chat-header .chat-partner { font-weight:600; font-size:15px; }
        #chat-header .chat-partner-status { font-size:12px; margin-top:1px; }
        .call-btn {
            padding:8px 18px; background:var(--gradient); color:#fff; border:none; border-radius:20px; cursor:pointer; font-weight:600;
            font-size:13px; transition:var(--transition); box-shadow:0 2px 8px rgba(139,92,246,0.25); white-space:nowrap;
        }
        .call-btn:hover { box-shadow:0 4px 16px rgba(139,92,246,0.4); transform:translateY(-1px); }
        .call-btn.in-call { background:var(--danger); box-shadow:0 2px 8px rgba(239,68,68,0.3); }
        #messages-container {
            flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:4px;
            background:radial-gradient(ellipse at 50% 50%, rgba(139,92,246,0.02) 0%, transparent 70%);
        }
        #messages-container::-webkit-scrollbar { width:4px; }
        #messages-container::-webkit-scrollbar-thumb { background:#3a3a50; border-radius:4px; }
        .message { max-width:72%; padding:10px 15px; border-radius:18px; font-size:14px; line-height:1.45; word-break:break-word; animation:msgIn 0.25s ease; }
        @keyframes msgIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
        .message.sent { align-self:flex-end; background:var(--gradient-dark); color:#fff; border-bottom-right-radius:6px; box-shadow:0 2px 8px rgba(139,92,246,0.2); }
        .message.received { align-self:flex-start; background:var(--surface2); border-bottom-left-radius:6px; border:1px solid var(--border); }
        .message .msg-time { font-size:10px; opacity:0.65; margin-top:4px; text-align:right; }
        #input-area { padding:12px 20px; border-top:1px solid var(--border); display:flex; gap:10px; background:rgba(0,0,0,0.1); }
        #input-area input {
            flex:1; padding:11px 18px; background:var(--surface2); border:1.5px solid var(--border); border-radius:24px; color:var(--text);
            font-size:14px; outline:none; transition:var(--transition);
        }
        #input-area input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(139,92,246,0.1); }
        #input-area button {
            width:44px; height:44px; border-radius:50%; background:var(--gradient); color:#fff; border:none; cursor:pointer; font-size:18px;
            transition:var(--transition); flex-shrink:0; box-shadow:0 2px 8px rgba(139,92,246,0.3);
        }
        #input-area button:hover { transform:scale(1.05); box-shadow:0 4px 16px rgba(139,92,246,0.45); }
        #input-area button:active { transform:scale(0.94); }
        .no-chat { flex:1; display:flex; align-items:center; justify-content:center; color:var(--text2); font-size:14px; flex-direction:column; gap:10px; }
        /* === CALL OVERLAY === */
        #call-overlay {
            display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(10,10,18,0.92);
            backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); z-index:100; flex-direction:column; align-items:center; justify-content:center; gap:24px;
        }
        #call-overlay.active { display:flex; }
        #call-overlay .call-avatar {
            width:80px; height:80px; border-radius:50%; background:var(--gradient); display:flex; align-items:center; justify-content:center;
            font-size:36px; font-weight:700; color:#fff; box-shadow:0 8px 32px rgba(139,92,246,0.4); animation:pulse 2s infinite;
        }
        @keyframes pulse { 0%,100%{ box-shadow:0 8px 32px rgba(139,92,246,0.4); } 50%{ box-shadow:0 8px 48px rgba(139,92,246,0.7); } }
        #call-overlay .call-info { font-size:20px; font-weight:600; }
        #call-overlay .call-status { font-size:13px; color:var(--accent2); min-height:20px; }
        #call-overlay .call-controls { display:flex; gap:20px; align-items:center; margin-top:8px; }
        #call-overlay .call-controls button { width:60px; height:60px; border-radius:50%; border:none; cursor:pointer; font-size:24px; transition:var(--transition); }
        .btn-hangup { background:var(--danger); color:#fff; box-shadow:0 4px 16px rgba(239,68,68,0.4); }
        .btn-hangup:hover { background:#dc2626; transform:scale(1.08); }
        .btn-mute { background:var(--surface2); color:var(--text); border:2px solid var(--border)!important; }
        .btn-mute.muted { background:var(--danger); border-color:var(--danger)!important; color:#fff; }
        #volume-control-area { display:flex; align-items:center; gap:12px; background:var(--surface2); padding:12px 22px; border-radius:28px; border:1px solid var(--border); }
        #volume-slider { -webkit-appearance:none; width:150px; height:6px; border-radius:3px; background:#3a3a50; outline:none; cursor:pointer; }
        #volume-slider::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:var(--gradient); cursor:pointer; box-shadow:0 2px 8px rgba(139,92,246,0.4); }
        #volume-label { font-size:13px; font-weight:600; width:42px; text-align:center; color:var(--accent2); }
        /* === TOAST === */
        #toast {
            position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#1f1f36; color:#fff; padding:11px 24px;
            border-radius:24px; font-size:13px; z-index:200; opacity:0; transition:opacity 0.3s; pointer-events:none; border:1px solid var(--border); box-shadow:0 8px 24px rgba(0,0,0,0.5);
        }
        #toast.show { opacity:1; }
        /* === RESPONSIVE === */
        @media (max-width:650px) {
            #app { height:100vh; max-height:100vh; border-radius:0; max-width:100%; }
            #sidebar { width:100%; min-width:100%; }
            #main-screen.chat-open #sidebar { display:none; }
            #main-screen.chat-open #chat-area { display:flex; }
            #chat-area { display:none; }
            #chat-area.active-mobile { display:flex; }
            .back-btn { display:inline-flex!important; }
            #volume-slider { width:100px; }
        }
        .back-btn { display:none; background:none; border:none; color:var(--accent2); font-size:22px; cursor:pointer; padding:4px 8px; align-items:center; justify-content:center; transition:var(--transition); }
        .back-btn:hover { color:#fff; }
    </style>
</head>
<body>
<div id="app">
    <!-- AUTH SCREEN -->
    <div id="auth-screen">
        <div class="logo-icon">💬</div>
        <div class="logo">Lumen</div>
        <div class="subtitle">Бесплатный мессенджер<br>с сохранением истории и звонками</div>
        <div class="auth-tabs">
            <button class="auth-tab active" id="tab-login">Вход</button>
            <button class="auth-tab" id="tab-register">Регистрация</button>
        </div>
        <!-- Поля входа -->
        <div id="login-fields">
            <input type="text" id="login-identity" placeholder="Никнейм или Email" autocomplete="username">
            <input type="password" id="login-password" placeholder="Пароль" autocomplete="current-password">
        </div>
        <!-- Поля регистрации -->
        <div id="reg-fields">
            <input type="email" id="reg-email" placeholder="Email (настоящий)" autocomplete="email">
            <input type="text" id="reg-nickname" placeholder="Никнейм (как вас увидят)" maxlength="20" autocomplete="off">
            <input type="password" id="reg-password" placeholder="Пароль (мин. 6 символов)" maxlength="50" autocomplete="new-password">
        </div>
        <div class="auth-error" id="auth-error"></div>
        <button class="btn btn-primary" id="btn-submit">🚀 Войти</button>
        <div class="auth-hint">Входите по никнейму или email • Данные в облаке Supabase</div>
    </div>

    <!-- MAIN SCREEN -->
    <div id="main-screen">
        <div id="sidebar">
            <div id="sidebar-header">
                <div class="user-info"><div class="avatar" id="my-avatar">?</div><span class="username" id="my-username"></span></div>
                <button class="logout-btn" id="btn-logout">Выйти</button>
            </div>
            <div class="sidebar-section-title">💬 Контакты</div>
            <div id="contacts-list"></div>
            <div id="add-contact-area">
                <input type="text" id="add-contact-input" placeholder="Никнейм для добавления..."><button id="btn-add-contact">＋</button>
            </div>
        </div>
        <div id="chat-area">
            <div id="chat-header" style="display:none;">
                <button class="back-btn" id="btn-back">←</button>
                <div class="chat-partner-wrap"><div class="chat-partner" id="chat-partner-name"></div><div class="chat-partner-status" id="chat-partner-status"></div></div>
                <button class="call-btn" id="btn-call">📞 Звонок</button>
            </div>
            <div id="messages-container"></div>
            <div class="no-chat" id="no-chat-placeholder"><div style="font-size:48px;opacity:0.5;">💬</div><div>Выберите контакт, чтобы начать общение</div></div>
            <div id="input-area" style="display:none;">
                <input type="text" id="message-input" placeholder="Напишите сообщение..." maxlength="2000" autocomplete="off"><button id="btn-send">➤</button>
            </div>
        </div>
    </div>
</div>

<!-- CALL OVERLAY -->
<div id="call-overlay">
    <div class="call-avatar" id="call-avatar-display">?</div>
    <div class="call-info" id="call-partner-display"></div>
    <div class="call-status" id="call-status">Соединение...</div>
    <div id="volume-control-area">
        <label>🔊</label><input type="range" id="volume-slider" min="0" max="100" value="50" step="1"><span id="volume-label">50%</span>
    </div>
    <div class="call-controls">
        <button class="btn-mute" id="btn-toggle-mic" title="Вкл/выкл микрофон">🎤</button>
        <button class="btn-hangup" id="btn-hangup">📞</button>
    </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
(function(){

// ==================== SUPABASE: ПРОФИЛИ ====================
async function upsertProfile(uid,nick){await supabase.from('lumen_profiles').upsert({id:uid,nickname:nick,updated_at:new Date().toISOString()},{onConflict:'id'});}

// ==================== SUPABASE: КОНТАКТЫ ====================

    if(!currentUser)return;
    const{data}=await supabase.from('lumen_contacts').select('contact_id,profiles!lumen_contacts_contact_id_fkey(nickname)').eq('user_id',currentUser.id);
    contacts=(data||[]).map(r=>({contact_id:r.contact_id,nickname:r.profiles?.nickname||'Неизвестный'}));
    renderContacts();
}
async function addContact(cid){
    if(cid===currentUser.id){showToast('Нельзя добавить себя');return;}
    if(contacts.find(c=>c.contact_id===cid)){showToast('Уже в контактах');return;}
    await supabase.from('lumen_contacts').insert({user_id:currentUser.id,contact_id:cid});
    await loadContacts();showToast('✅ Добавлен');
}
function renderContacts(){
    contactsList.innerHTML='';
    if(!contacts.length){contactsList.innerHTML='<div style="padding:30px;text-align:center;color:var(--text2);font-size:13px;">Список пуст</div>';return;}
    contacts.forEach(c=>{
        const status=contactsStatuses[c.contact_id]||'offline';
        const d=document.createElement('div');d.className='contact-item'+(c.contact_id===currentContactId?' active':'');
        d.innerHTML=`<div class="contact-avatar">${getInitials(c.nickname)}<div class="status-dot ${status}"></div></div><div class="contact-info"><div class="contact-name">${escapeHtml(c.nickname)}</div><div class="contact-status">${status==='online'?'🟢 В сети':'⚫ Не в сети'}</div></div>`;
        d.addEventListener('click',()=>openChat(c.contact_id,c.nickname));contactsList.appendChild(d);
    });
}

// ==================== SUPABASE: СООБЩЕНИЯ ====================
async function loadMessages(){
    if(!currentContactId||!currentUser)return;
    const{data}=await supabase.from('lumen_messages').select('*').or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentContactId}),and(sender_id.eq.${currentContactId},receiver_id.eq.${currentUser.id})`).order('created_at',{ascending:true}).limit(300);
    messagesCache[currentContactId]=data||[];renderMessages();
}
function renderMessages(){
    messagesContainer.innerHTML='';
    const msgs=messagesCache[currentContactId]||[];
    if(!msgs.length){messagesContainer.innerHTML='<div style="text-align:center;color:var(--text2);padding:50px;font-size:13px;">💬 Нет сообщений</div>';return;}
    msgs.forEach(m=>{
        const d=document.createElement('div');d.className='message '+(m.sender_id===currentUser.id?'sent':'received');
        d.innerHTML=`${escapeHtml(m.text)}<div class="msg-time">${formatTime(m.created_at)}</div>`;messagesContainer.appendChild(d);
    });
    messagesContainer.scrollTop=messagesContainer.scrollHeight;
}
async function sendMessage(text){
    if(!text.trim()||!currentContactId||!currentUser)return;
    await supabase.from('lumen_messages').insert({sender_id:currentUser.id,receiver_id:currentContactId,text:text.trim(),created_at:new Date().toISOString()});
}

function subscribeToMessages(){
    if(messagesSubscription)supabase.removeChannel(messagesSubscription);
    if(!currentUser)return;
    messagesSubscription=supabase.channel('msg_ch').on('postgres_changes',{event:'INSERT',schema:'public',table:'lumen_messages',filter:`receiver_id=eq.${currentUser.id}`},payload=>{
        const msg=payload.new;
        if(msg.sender_id===currentContactId){
            if(!messagesCache[currentContactId])messagesCache[currentContactId]=[];
            if(!messagesCache[currentContactId].some(m=>m.sender_id===msg.sender_id&&m.text===msg.text&&m.created_at===msg.created_at)){
                messagesCache[currentContactId].push(msg);renderMessages();
            }
        }
    }).subscribe();
}

// ==================== PRESENCE ====================
function setupPresence(){
    if(presenceChannel)supabase.removeChannel(presenceChannel);
    if(!currentUser)return;
    presenceChannel=supabase.channel('pres_ch',{config:{broadcast:{self:false}}});
    presenceChannel.on('broadcast',{event:'presence_update'},payload=>{
        const{userId,peerId,status,nickname}=payload.payload;
        if(userId===currentUser.id)return;
        contactsStatuses[userId]=status;if(peerId)peerIdToContactId[userId]=peerId;
        renderContacts();if(userId===currentContactId)updateChatPartnerStatus();
    });
    presenceChannel.subscribe(s=>{if(s==='SUBSCRIBED')broadcastPresence();});
}
function broadcastPresence(){
    if(!presenceChannel||!currentUser)return;
    presenceChannel.send({type:'broadcast',event:'presence_update',payload:{userId:currentUser.id,peerId:peer?.id||null,status:'online',nickname:currentUser.user_metadata?.nickname||'User'}});
}
function broadcastOffline(){
    if(!presenceChannel||!currentUser)return;
    presenceChannel.send({type:'broadcast',event:'presence_update',payload:{userId:currentUser.id,peerId:null,status:'offline',nickname:currentUser.user_metadata?.nickname||'User'}});
}

// ==================== PEERJS / ЗВОНКИ ====================
function setupPeer(){
    if(!currentUser)return;if(peer)try{peer.destroy();}catch(e){}
    peer=new Peer(currentUser.id,{host:PEERJS_HOST,port:PEERJS_PORT,secure:PEERJS_SECURE,debug:0});
    peer.on('open',()=>broadcastPresence());
    peer.on('call',async call=>{if(currentCall){call.close();return;}try{localStream=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){showToast('Нет микрофона');call.close();return;}call.answer(localStream);setupCallUI(call);});
    peer.on('error',()=>{});
    peer.on('disconnected',()=>peer.reconnect());
}
async function startCall(){
    if(!currentContactId||!peer||currentCall)return;
    try{localStream=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){showToast('Нет микрофона');return;}
    const target=peerIdToContactId[currentContactId]||currentContactId;
    const call=peer.call(target,localStream);if(!call){if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null;}showToast('Абонент недоступен');return;}
    setupCallUI(call);
}
function setupCallUI(call){
    currentCall=call;callOverlay.classList.add('active');callAvatarDisplay.textContent=getInitials(currentContactUsername||'?');
    callPartnerDisplay.textContent='📞 '+(currentContactUsername||'Собеседник');callStatus.textContent='Соединение...';callStatus.style.color='var(--accent2)';
    volumeSlider.value=50;volumeLabel.textContent='50%';isMuted=false;btnToggleMic.classList.remove('muted');btnToggleMic.textContent='🎤';
    if(localStream)localStream.getAudioTracks().forEach(t=>t.enabled=true);
    btnCall.classList.add('in-call');btnCall.textContent='📞 В звонке';
    call.on('stream',rs=>{
        callStatus.textContent='🟢 Разговор';callStatus.style.color='var(--online)';
        if(remoteAudio){remoteAudio.srcObject=null;remoteAudio.remove();}
        remoteAudio=document.createElement('audio');remoteAudio.srcObject=rs;remoteAudio.autoplay=true;remoteAudio.playsInline=true;document.body.appendChild(remoteAudio);applyVolume();
    });
    call.on('close',()=>{endCallUI();showToast('Звонок завершён');});
    call.on('error',()=>{callStatus.textContent='Ошибка';setTimeout(endCallUI,2000);});
}
function applyVolume(){
    if(!remoteAudio)return;const v=parseInt(volumeSlider.value);let g;
    const pts=[[0,0],[1,0.002],[25,0.1],[50,0.2],[75,0.5],[100,1.0]];
    if(v<=0)g=0;else if(v>=100)g=1;else for(let i=0;i<pts.length-1;i++)if(v>=pts[i][0]&&v<=pts[i+1][0]){g=pts[i][1]+(v-pts[i][0])/(pts[i+1][0]-pts[i][0])*(pts[i+1][1]-pts[i][1]);break;}
    remoteAudio.volume=Math.max(0,Math.min(1,g));
}
function toggleMute(){isMuted=!isMuted;if(localStream)localStream.getAudioTracks().forEach(t=>t.enabled=!isMuted);btnToggleMic.classList.toggle('muted',isMuted);btnToggleMic.textContent=isMuted?'🔇':'🎤';}
function endCall(){if(currentCall)try{currentCall.close();}catch(e){}endCallUI();}
function endCallUI(){
    callOverlay.classList.remove('active');if(remoteAudio){remoteAudio.srcObject=null;remoteAudio.remove();remoteAudio=null;}
    if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null;}
    currentCall=null;isMuted=false;btnToggleMic.classList.remove('muted');btnToggleMic.textContent='🎤';
    btnCall.classList.remove('in-call');btnCall.textContent='📞 Звонок';
}

// ==================== ЧАТ ====================
async function openChat(cid,cnick){
    currentContactId=cid;currentContactUsername=cnick;chatPartnerName.textContent=cnick;updateChatPartnerStatus();
    chatHeader.style.display='flex';inputArea.style.display='flex';noChatPlaceholder.style.display='none';
    mainScreen.classList.add('chat-open');document.getElementById('chat-area').classList.add('active-mobile');
    btnCall.classList.toggle('in-call',!!currentCall);btnCall.textContent=currentCall?'📞 В звонке':'📞 Звонок';
    renderContacts();await loadMessages();messageInput.focus();
}
function updateChatPartnerStatus(){
    if(!currentContactId)return;const s=contactsStatuses[currentContactId]||'offline';
    chatPartnerStatus.textContent=s==='online'?'🟢 В сети':'⚫ Не в сети';chatPartnerStatus.style.color=s==='online'?'var(--online)':'var(--text2)';
}

// ==================== АВТОРИЗАЦИЯ ====================
// Вход: ищем профиль по никнейму → получаем email → входим через Supabase
async function signInByIdentity(identity, password) {
    // Определяем: email или никнейм
    const isEmail = identity.includes('@');
    let email = identity.trim();

    if (!isEmail) {
        // Ищем профиль по никнейму
        const profile = await findProfileByNickname(identity.trim());
        if (!profile) throw new Error('Пользователь с таким никнеймом не найден');
        // Получаем email пользователя (он хранится в Supabase Auth, не в profiles)
        // Но мы не можем достать чужой email. Поэтому ищем через нашу таблицу profiles + auth.
        // Решение: хранить email в profiles тоже.
        if (!profile.email) throw new Error('Не удалось определить email. Войдите по email.');
        email = profile.email;
    }

    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) throw error;
    if (data.user) {
        await upsertProfile(data.user.id, data.user.user_metadata?.nickname || email.split('@')[0]);
    }
    return data;
}

async function signUp(email, password, nickname) {
    const { data, error } = await supabase.auth.signUp({
        email: email.trim(),
        password,
        options: { data: { nickname } }
    });
    if (error) throw error;
    if (data.user) {
        // Сохраняем email в profiles для быстрого входа по нику
        await supabase.from('lumen_profiles').upsert({
            id: data.user.id,
            nickname,
            email: email.trim(),
            updated_at: new Date().toISOString()
        }, { onConflict: 'id' });
    }
    return data;
}

// ==================== ГЛАВНЫЙ ПОТОК ====================
async function onUserReady(user) {
    currentUser = user;
    if (!user) {
        authScreen.style.display='flex'; mainScreen.classList.remove('active'); broadcastOffline();
        if(presenceChannel){supabase.removeChannel(presenceChannel);presenceChannel=null;}
        if(messagesSubscription){supabase.removeChannel(messagesSubscription);messagesSubscription=null;}
        if(peer){peer.destroy();peer=null;} if(presenceInterval){clearInterval(presenceInterval);presenceInterval=null;}
        endCallUI(); contacts=[]; currentContactId=null; currentContactUsername=null; messagesCache={};
        contactsList.innerHTML=''; chatHeader.style.display='none'; inputArea.style.display='none'; noChatPlaceholder.style.display='flex';
        messagesContainer.innerHTML=''; document.getElementById('chat-area').classList.remove('active-mobile'); mainScreen.classList.remove('chat-open');
        return;
    }
    const nick = user.user_metadata?.nickname || user.email?.split('@')[0] || 'User';
    await upsertProfile(user.id, nick);
    authScreen.style.display='none'; mainScreen.classList.add('active');
    myAvatar.textContent=getInitials(nick); myUsername.textContent=nick;
    await loadContacts(); setupPeer(); setupPresence(); subscribeToMessages(); broadcastPresence();
    if(presenceInterval)clearInterval(presenceInterval);
    presenceInterval=setInterval(()=>{if(currentUser&&presenceChannel)broadcastPresence();},40000);
}

// ==================== ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК ====================
function setAuthMode(mode) {
    authMode = mode;
    if (mode === 'login') {
        tabLogin.classList.add('active'); tabRegister.classList.remove('active');
        loginFields.style.display = 'block'; regFields.classList.remove('show');
        btnSubmit.textContent = '🚀 Войти';
    } else {
        tabRegister.classList.add('active'); tabLogin.classList.remove('active');
        loginFields.style.display = 'none'; regFields.classList.add('show');
        btnSubmit.textContent = '✨ Создать аккаунт';
    }
    authError.textContent = '';
}

tabLogin.addEventListener('click', () => setAuthMode('login'));
tabRegister.addEventListener('click', () => setAuthMode('register'));

// ==================== ОБРАБОТЧИК ОСНОВНОЙ КНОПКИ ====================
btnSubmit.addEventListener('click', async () => {
    authError.textContent = '';
    btnSubmit.disabled = true;

    if (authMode === 'register') {
        const email = regEmail.value.trim();
        const nick = regNickname.value.trim();
        const pass = regPassword.value;
        if (!email || !nick || pass.length < 6) {
            authError.textContent = 'Заполните все поля. Пароль минимум 6 символов.';
            btnSubmit.disabled = false; return;
        }
        btnSubmit.textContent = 'Создаём...';
        try {
            await signUp(email, pass, nick);
            showToast('✅ Аккаунт создан! Теперь войдите.');
            setAuthMode('login');
            loginIdentity.value = nick;
            regEmail.value = ''; regNickname.value = ''; regPassword.value = '';
        } catch (e) {
            authError.textContent = e.message.includes('already registered') ? 'Этот email уже зарегистрирован' : (e.message || 'Ошибка');
        }
        btnSubmit.textContent = '✨ Создать аккаунт';
        btnSubmit.disabled = false;
        return;
    }

    // LOGIN
    const identity = loginIdentity.value.trim();
    const pass = loginPassword.value;
    if (!identity || pass.length < 6) {
        authError.textContent = 'Введите никнейм/email и пароль.';
        btnSubmit.disabled = false; return;
    }
    btnSubmit.textContent = 'Входим...';
    try {
        await signInByIdentity(identity, pass);
        showToast('👋 Добро пожаловать!');
        loginIdentity.value = ''; loginPassword.value = '';
    } catch (e) {
        const msg = e.message || '';
        if (msg.includes('Invalid login') || msg.includes('Invalid')) {
            authError.textContent = 'Неверный никнейм/email или пароль';
        } else if (msg.includes('не найден')) {
            authError.textContent = msg;
        } else {
            authError.textContent = 'Ошибка входа. Проверьте данные.';
        }
    }
    btnSubmit.textContent = '🚀 Войти';
    btnSubmit.disabled = false;
});

// Enter в полях
[loginIdentity, loginPassword, regEmail, regNickname, regPassword].forEach(el => {
    el.addEventListener('keydown', e => { if (e.key === 'Enter') btnSubmit.click(); });
});

// ==================== ОСТАЛЬНЫЕ ОБРАБОТЧИКИ ====================
btnLogout.addEventListener('click', async () => { broadcastOffline(); await supabase.auth.signOut(); });
btnAddContact.addEventListener('click', async () => {
    const n = addContactInput.value.trim(); if (!n) { showToast('Введите никнейм'); return; }
    const p = await findProfileByNickname(n); if (!p) { showToast('Пользователь не найден'); return; }
    await addContact(p.id); addContactInput.value = '';
});
addContactInput.addEventListener('keydown', e => { if (e.key === 'Enter') btnAddContact.click(); });
btnSend.addEventListener('click', async () => {
    const t = messageInput.value; if (!t.trim()) return;
    messageInput.value = ''; await sendMessage(t); messageInput.focus();
});
messageInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); btnSend.click(); } });
btnCall.addEventListener('click', () => { if (currentCall) endCall(); else startCall(); });
btnHangup.addEventListener('click', endCall);
btnToggleMic.addEventListener('click', toggleMute);
volumeSlider.addEventListener('input', () => { volumeLabel.textContent = volumeSlider.value + '%'; applyVolume(); });
btnBack.addEventListener('click', () => {
    currentContactId = null; currentContactUsername = null;
    chatHeader.style.display = 'none'; inputArea.style.display = 'none'; noChatPlaceholder.style.display = 'flex';
    messagesContainer.innerHTML = '';
    document.getElementById('chat-area').classList.remove('active-mobile'); mainScreen.classList.remove('chat-open');
    renderContacts();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && currentCall) endCall(); });
window.addEventListener('beforeunload', () => broadcastOffline());
window.addEventListener('offline', () => showToast('🔴 Нет сети'));
window.addEventListener('online', () => { showToast('🟢 Онлайн'); broadcastPresence(); if (peer && peer.disconnected) peer.reconnect(); });

// ==================== ИНИЦИАЛИЗАЦИЯ ====================
setAuthMode('login');
supabase.auth.onAuthStateChange((_, session) => onUserReady(session?.user || null));
(async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    await onUserReady(session?.user || null);
    console.log('💜 Lumen Messenger готов');
})();
})();
</script>
